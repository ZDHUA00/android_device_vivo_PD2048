name: Build LineageOS 20 for PD2048

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          set +e
          sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=0 update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick libelf-dev lz4 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
          sudo apt-get install -y --no-install-recommends openjdk-11-jdk || sudo apt-get install -y --no-install-recommends openjdk-17-jdk
          sudo apt-get install -y --no-install-recommends lib32z1-dev lib32readline-dev libncurses-dev
          exit 0

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "ZDHUA00"
          git config --global user.email "133396238+ZDHUA00@users.noreply.github.com"
          git lfs install

      - name: Sync LineageOS 20
        run: |
          set -o pipefail
          df -h | tee "$GITHUB_WORKSPACE/sync.log"
          mkdir -p "$GITHUB_WORKSPACE/lineage"
          cd "$GITHUB_WORKSPACE/lineage"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 2>&1 | tee -a "$GITHUB_WORKSPACE/sync.log"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/pd2048.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="ZDHUA00/android_device_vivo_PD2048" path="device/vivo/PD2048" remote="github" revision="main" />
            <project name="ZDHUA00/android_vendor_vivo_PD2048" path="vendor/vivo/PD2048" remote="github" revision="main" />
          </manifest>
          EOF
          repo manifest -o /tmp/full.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          t = ET.parse('/tmp/full.xml'); r = t.getroot()
          keep = ('device/vivo/PD2048', 'device/lineage', 'device/generic', 'device/google/cuttlefish', 'vendor/vivo/PD2048', 'vendor/lineage', 'kernel/configs')
          removed = 0
          for p in list(r.findall('project')):
              path = p.get('path') or p.get('name') or ''
              if (path.startswith('device/') or path.startswith('vendor/') or path.startswith('kernel/') or path.startswith('hardware/qcom')) and not any(path == k or path.startswith(k + '/') for k in keep):
                  r.remove(p); removed += 1
          t.write('.repo/manifests/default.xml', encoding='utf-8', xml_declaration=True)
          print('removed projects:', removed)
          PY
          rm -rf .repo/local_manifests
          repo sync --no-manifest-update -c --force-sync --no-clone-bundle --no-tags -j$(nproc) 2>&1 | tee -a "$GITHUB_WORKSPACE/sync.log"
          df -h | tee -a "$GITHUB_WORKSPACE/sync.log"

      - name: Build systemimage
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/lineage"
          exec >> "$GITHUB_WORKSPACE/build.log" 2>&1
          du -sh .repo || true
          { echo "repo size: $(du -sh .repo 2>/dev/null | cut -f1)"; df -h; } | tee "$GITHUB_WORKSPACE/diag.txt"
          rm -rf .repo
          for d in cts test platform_testing developers sdk prebuilts/qemu-kernel tools/test tools/tradefederation art/test; do
            if [ -d "$d" ]; then find "$d" -type f \( -name '*.java' -o -name '*.kt' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.S' -o -name '*.s' -o -name '*.py' \) -delete; fi
          done
          find . -type d \( -name tests -o -name test \) -prune -print0 2>/dev/null | while IFS= read -r -d '' t; do find "$t" -type f \( -name '*.java' -o -name '*.kt' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.S' -o -name '*.s' -o -name '*.py' \) -delete; done
          df -h | tee -a "$GITHUB_WORKSPACE/diag.txt"
          mkdir -p packages/modules/Virtualization/kernel/prebuilts
          cd packages/modules/Virtualization/kernel/prebuilts
          touch dummy_kernel dummy_modules dummy_bootloader dummy_key
          cat > Android.bp <<'EOF'
          filegroup { name: "kernel_prebuilts-5.10-arm64", srcs: ["dummy_kernel"] }
          filegroup { name: "kernel_prebuilts-5.10-x86_64", srcs: ["dummy_kernel"] }
          filegroup { name: "virt_device_prebuilts_kernel_modules_microdroid-5.10-arm64", srcs: ["dummy_modules"] }
          filegroup { name: "virt_device_prebuilts_kernel_modules_microdroid-5.10-x86_64", srcs: ["dummy_modules"] }
          filegroup { name: "microdroid_crosvm_bootloader", srcs: ["dummy_bootloader"] }
          filegroup { name: "microdroid_crosvm_bootloader.avbpubkey", srcs: ["dummy_key"] }
          EOF
          cd "$GITHUB_WORKSPACE/lineage"
          df -h
          source build/envsetup.sh
          lunch lineage_PD2048-userdebug
          free -h
          df -h
          mka systemimage -j2

      - name: Upload system image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PD2048-systemimage
          path: |
            ${{ github.workspace }}/lineage/out/target/product/PD2048/system.img
            ${{ github.workspace }}/lineage/out/target/product/PD2048/*.img
          if-no-files-found: warn

      - name: Report failure log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          diag = ""
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "diag.txt")
          if os.path.isfile(p):
              diag = open(p, errors="replace").read()[:4000]
          logs = []
          for name in ("sync.log", "build.log"):
              p = os.path.join(os.environ["GITHUB_WORKSPACE"], name)
              if os.path.isfile(p):
                  data = open(p, errors="replace").read()
                  logs.append("===== %s (tail) =====\n%s" % (name, data[-20000:]))
          NL = chr(10)
          body = json.dumps({
              "title": "CI failure log (run %s)" % os.environ.get("GITHUB_RUN_NUMBER", "?"),
              "body": "```" + NL + NL.join(logs)[-45000:] + NL + "```" + NL + "```" + NL + diag + NL + "```",
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/issues" % os.environ["REPO"],
              data=body, method="POST")
          req.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("User-Agent", "zcode-ci")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("issue created", r.status)
          except Exception as e:
              print("issue create failed", e)
          PY
